<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC Online Judge - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-center">Entrar no Sistema</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">E-mail</label>
                <input type="email" id="email" class="w-full p-2 bg-gray-700 rounded border border-gray-600 text-white focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Senha</label>
                <input type="password" id="password" class="w-full p-2 bg-gray-700 rounded border border-gray-600 text-white focus:outline-none focus:border-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold transition">Entrar</button>
        </form>
        <p class="text-sm text-gray-400 mt-4 text-center">Não tem conta? <a href="register.html" class="text-blue-500 hover:underline">Cadastre-se</a></p>
    </div>
</body>
</html>
